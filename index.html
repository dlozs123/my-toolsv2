<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梦之碎片 多功能工具箱</title>
  
  <!-- PWA 支持 (如果你有 manifest.json 等文件，保留这些) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <meta name="theme-color" content="#4CAF50">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>

  <!-- 引入样式表 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>梦之碎片 多功能工具箱</header>
  <nav>
    <button onclick="app.showTab('characters')" class="active">角色查找</button>
    <button onclick="app.showTab('distribution')">人形分布</button>
    <button onclick="app.showTab('items')">隐藏物品</button>
    <button onclick="app.showTab('weather')">异常/气象/地相</button>
    <button onclick="app.showTab('maps')">支线地图/迷宫区域</button>
    <button onclick="app.showTab('bosses')">主要Boss</button>
  </nav>

  <!-- 1. 角色查找 -->
  <section id="characters" class="active">
    <div class="search-container">
      <input type="text" id="characterSearchInput" placeholder="输入角色名、拼音首字母或罗马音..." autocomplete="off" />
    </div>
    <div id="characterResultList" class="result-list"></div>
    <div id="characterResults" class="results"></div>
  </section>

  <!-- 2. 人形分布 -->
  <section id="distribution">
    <h2>人形分布查询</h2>
    <div class="control-group">
      <label for="mapSelect">选择地图：</label>
      <select id="mapSelect"></select>
    </div>
    <div class="control-group">
      <label for="distSearchInput">角色名查找：</label>
      <input type="text" id="distSearchInput" placeholder="输入角色名（日文）" />
    </div>
    <table>
      <thead>
        <tr>
          <th>人形名</th>
          <th>地图</th>
          <th>備考</th>
        </tr>
      </thead>
      <tbody id="distributionTable"></tbody>
    </table>
  </section>

  <!-- 3. 隐藏物品 -->
  <section id="items">
    <h2>隐藏物品查询</h2>
    <div class="nav-controls">
      <label for="hiddenMapSelect">选择地图：</label>
      <select id="hiddenMapSelect"></select>
      <button onclick="app.prevHiddenMap()">← 上一个</button>
      <button onclick="app.nextHiddenMap()">下一个 →</button>
    </div>
    <div id="hiddenItemsList"></div>
  </section>

  <!-- 4. 异常/气象/地相 -->
  <section id="weather">
    <h2>异常状态 / 气象 / 地相 查询</h2>
    <div>
      <label for="categorySelect">选择分类：</label>
      <select id="categorySelect">
        <option value="abnormal">異常</option>
        <option value="status">状態変化</option>
        <option value="weather">気象</option>
        <option value="terrain">地相</option>
        <option value="field">設置技</option>
      </select>
    </div>
    <div id="statusTableContainer"></div>
  </section>

  <!-- 5. 支线地图 -->
  <section id="maps">
    <h2>支线地图 / 迷宫区域</h2>
    <div class="control-group">
      <label for="mapSelectExtra">选择地图：</label>
      <select id="mapSelectExtra"></select>
    </div>
    <div id="extraMapDescription"></div>
  </section>

  <!-- 6. 主要Boss -->
  <section id="bosses">
    <h2>主要Boss查询</h2>
    <div class="control-group">
      <label for="locationSelect">选择場所：</label>
      <select id="locationSelect"></select>
    </div>
    <table>
      <thead>
        <tr>
          <th>人形遣い名</th>
          <th>使用人形</th>
          <th>装飾品</th>
          <th>スタイル</th>
          <th>レベル</th>
        </tr>
      </thead>
      <tbody id="bossTableBody"></tbody>
    </table>
    <div id="noteArea"></div>
  </section>

  <!-- 引入逻辑脚本 -->
  <script src="./js/app.js"></script>
</body>
</html>
